[package]
name = "fenirer-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[[bin]]
name = "fenirer_fuzzer"
path = "fenirer_fuzzer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_fuzzer"
path = "fuzz_targets/decode_fuzzer.rs"

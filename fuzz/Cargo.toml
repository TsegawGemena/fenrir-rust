doc = false
bench = false

[[bin]]
name = "chunked_fuzzer"
path = "fuzz_targets/chunked_fuzzer.rs"
test = false
doc = false
bench = false

[dependencies]
libfuzzer-sys = "0.4"
fenirer = { path = ".." }

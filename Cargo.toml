[package]
name = "fenirer"
version = "0.1.0"
edition = "2021"
description = "Edge telemetry and event stream decoder for FENR/FN2R wire records"
license = "MIT"
keywords = ["streaming", "telemetry", "parser", "iot", "decoder"]
categories = ["encoding", "parser-implementations"]

[dependencies]
bitflags = "2.8"

[dev-dependencies]
proptest = "1.6"

[[bench]]
name = "decode_throughput"
harness = false

[workspace]
members = [".", "fuzz"]
